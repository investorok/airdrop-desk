<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airdrop Monitor • X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0e17; }
    .card { background: #111827; border: 1px solid #1f2937; }
    .tweet-card:hover { border-color: #6366f1; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
          Airdrop Monitor
        </h1>
        <p class="text-gray-400 text-sm mt-1">Важливі твіти про аірдропи</p>
      </div>
      <div class="text-right">
        <div id="status" class="text-sm text-green-400 flex items-center gap-2">
          <span class="w-2 h-2 bg-green-400 rounded-full pulse"></span>
          Live
        </div>
        <div id="lastUpdate" class="text-xs text-gray-500 mt-1">—</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="card rounded-2xl p-4 mb-6 flex flex-wrap gap-3 items-center">
      <button onclick="loadTweets(true)" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-xl text-sm font-medium transition">
        Оновити зараз
      </button>
      <select id="minLikes" class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm">
        <option value="20">мін. 20 лайків</option>
        <option value="50" selected>мін. 50 лайків</option>
        <option value="100">мін. 100 лайків</option>
        <option value="200">мін. 200 лайків</option>
      </select>
      <label class="flex items-center gap-2 text-sm text-gray-400">
        <input type="checkbox" id="autoRefresh" checked class="rounded">
        Автооновлення (2.5 хв)
      </label>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-16">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-indigo-500"></div>
      <p class="mt-4 text-gray-400">Шукаємо свіжі твіти...</p>
    </div>

    <!-- Tweets -->
    <div id="tweets" class="space-y-4"></div>

    <!-- Empty state -->
    <div id="empty" class="hidden text-center py-16 text-gray-500">
      Нічого не знайдено. Спробуй знизити фільтр лайків.
    </div>

    <div class="mt-12 text-center text-xs text-gray-600">
      Демо-версія з актуальними посиланнями на X.<br>
      Для справжнього real-time потрібен платний API.
    </div>
  </div>

  <script>
    // Актуальні твіти (станом на 24 жовтня 2026)
    const demoTweets = [
      {
        id: "2113852061880328516",
        author: "Duc Crypto",
        handle: "@DucCryptoX",
        text: "What an airdrop claim would need, and where Zaps stands on each part.\n\nEXISTS TODAY\n- A zaps balance...\n\nDOESN'T EXIST YET\n- Final rules, date, allocation...",
        likes: 161,
        reposts: 7,
        time: "нещодавно",
        url: "https://x.com/DucCryptoX/status/2113852061880328516"
      },
      {
        id: "2113840105215705459",
        author: "Airdrop Hunt with Lakhan",
        handle: "@CryptoLakhan",
        text: "💰 $30 Instant Claim + Withdrawal | Bitget 8th Anniversary Airdrop! 🎁\n\nBitget Is Celebrating Its 8th Anniversary With A $10M Reward Campaign!",
        likes: 48,
        reposts: 9,
        time: "6 годин тому",
        url: "https://x.com/CryptoLakhan/status/2113840105215705459"
      },
      {
        id: "2113832379169308825",
        author: "Sûmí",
        handle: "@0xmisty_",
        text: "GM CT\n\nChecking out @fomopoly_rh today the onchain city game...\n@rarelistio campaign is live with 2,000 USDT, 50 free mints & $DEAL airdrop.",
        likes: 68,
        reposts: 5,
        time: "6 годин тому",
        url: "https://x.com/0xmisty_/status/2113832379169308825"
      },
      {
        id: "2113791868303716417",
        author: "AirdropSnipersX",
        handle: "@AirdropSnipersX",
        text: "The @agentdojo × @rarelistio campaign is LIVE!\n\n1,500 USDT prize pool\nTop 20 share 1,000 USDT\n50 random winners...",
        likes: 63,
        reposts: 0,
        time: "9 годин тому",
        url: "https://x.com/AirdropSnipersX/status/2113791868303716417"
      },
      {
        id: "2113784032827785617",
        author: "XDAO",
        handle: "@xdaoapp",
        text: "WHAT $DAO IS FOR AND WHERE IT WILL LIVE\n\nWe're preparing to launch $DAO on Arbitrum... large-scale airdrop. Wallet linking is one of the most important steps.",
        likes: 2273,
        reposts: 15,
        time: "10 годин тому",
        url: "https://x.com/xdaoapp/status/2113784032827785617"
      },
      {
        id: "2113767594486349914",
        author: "Sinjoh",
        handle: "@SinjohDeFi",
        text: "Sinjoh 2.0 is officially LIVE - the most powerful launchpad on Robinhood Chain 💫\n\n- Launch tokens...\n- Airdrop rewards to holders...",
        likes: 94,
        reposts: 34,
        time: "11 годин тому",
        url: "https://x.com/SinjohDeFi/status/2113767594486349914"
      }
    ];

    let autoRefreshInterval = null;

    function renderTweets(tweets) {
      const container = document.getElementById('tweets');
      const empty = document.getElementById('empty');
      const minLikes = parseInt(document.getElementById('minLikes').value);

      const filtered = tweets.filter(t => t.likes >= minLikes);

      if (filtered.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      container.innerHTML = filtered.map(t => `
        <div class="card tweet-card rounded-2xl p-5 transition">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-2 flex-wrap">
                <span class="font-semibold">${t.author}</span>
                <span class="text-gray-500 text-sm">${t.handle}</span>
                <span class="text-gray-600 text-sm">· ${t.time}</span>
              </div>
              <p class="text-gray-200 whitespace-pre-line leading-relaxed text-sm sm:text-base">${t.text}</p>
              <div class="flex items-center gap-4 mt-4 text-sm text-gray-400">
                <span>❤️ ${t.likes.toLocaleString()}</span>
                <span>🔄 ${t.reposts.toLocaleString()}</span>
              </div>
            </div>
            <a href="${t.url}" target="_blank" rel="noopener noreferrer"
               class="shrink-0 bg-gray-800 hover:bg-indigo-600 px-4 py-2 rounded-xl text-sm transition whitespace-nowrap">
              Відкрити →
            </a>
          </div>
        </div>
      `).join('');
    }

    function loadTweets(manual = false) {
      const loading = document.getElementById('loading');
      if (manual) loading.classList.remove('hidden');

      setTimeout(() => {
        renderTweets(demoTweets);
        document.getElementById('lastUpdate').textContent = 
          'Оновлено: ' + new Date().toLocaleTimeString('uk-UA');
        loading.classList.add('hidden');
      }, manual ? 500 : 0);
    }

    function setupAutoRefresh() {
      clearInterval(autoRefreshInterval);
      if (document.getElementById('autoRefresh').checked) {
        autoRefreshInterval = setInterval(() => loadTweets(), 150000);
      }
    }

    document.getElementById('autoRefresh').addEventListener('change', setupAutoRefresh);
    document.getElementById('minLikes').addEventListener('change', () => loadTweets());

    // Старт
    loadTweets();
    setupAutoRefresh();
  </script>
</body>
</html>
